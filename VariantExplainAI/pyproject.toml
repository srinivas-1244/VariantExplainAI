[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variant-explain-ai"
version = "0.1.0"
description = "Allele-aware k-mer CNN sparse-transformer framework for ClinVar pathogenicity prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "scipy>=1.12",
  "PyYAML>=6.0", "matplotlib>=3.8", "torch>=2.2", "captum>=0.7",
  "pysam>=0.22", "pyfaidx>=0.8", "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]
