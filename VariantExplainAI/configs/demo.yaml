seed: 42
model:
  half_window: 50
  kmer_size: 5
  embedding_dim: 32
  hidden_dim: 64
  cnn_filters: [32, 64]
  cnn_kernels: [5, 3]
  transformer_layers: 2
  attention_heads: 4
  ff_dim: 128
  local_radius: 8
  global_stride: 16
  dropout: 0.10
  num_classes: 2
training:
  batch_size: 16
  epochs: 3
  learning_rate: 0.001
  min_learning_rate: 0.00001
  weight_decay: 0.0001
  patience: 3
  grad_clip: 1.0
  alignment_weight: 0.05
  ig_steps_train: 2
  ig_every_n_batches: 2
  num_workers: 0
  device: cpu
  threshold: 0.50
explainability:
  ig_steps_eval: 8
  alignment_radius_tokens: 3
  topk_fraction: 0.10
